[project]
name = "say-youll-remember-me"
version = "0.1.0"
description = "What changed about a team between seasons: head coaches, coordinators, quarterbacks."
readme = "README.md"
authors = []
requires-python = ">=3.12"
# Team identity comes from call-it-what-you-want, whose base install is
# itself dependency-free -- so reading this package's data pulls in nothing
# third-party beyond it. `imports_test.py` keeps that true.
dependencies = ["call-it-what-you-want"]

[project.scripts]
syrm = "say_youll_remember_me.sync:main"

# Pinned rather than floating: a team's ESPN id is how every row here is
# keyed, and which ids count as the same team is that package's answer.
[tool.uv.sources]
call-it-what-you-want = { git = "https://github.com/NathanDeMaria/call-it-what-you-want.git", rev = "f185eb03ac5bc3d9e0ff27f9a4172520e62af132" }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["say_youll_remember_me"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# these just re-export names for the public API
"__init__.py" = ["F401"]
